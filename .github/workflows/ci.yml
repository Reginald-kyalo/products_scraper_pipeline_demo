name: Offline demos
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        scrapy: ['2.12.0', '2.13.4', '2.16.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - if: matrix.scrapy == '2.12.0'
        run: python -m pip install -r requirements-dev.txt 'Scrapy==${{ matrix.scrapy }}' -c constraints-legacy.txt
      - if: matrix.scrapy != '2.12.0'
        run: python -m pip install -r requirements-dev.txt 'Scrapy==${{ matrix.scrapy }}'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_classifier.py -q
        env:
          DEMO_BROWSER_TEST: '1'
