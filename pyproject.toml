[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["01_proxy_rotation_scrapy", "02_geo_session_priming", "03_render_tier_pagination", "04_playwright_captcha_detect", "05_async_middleware_scrapy213"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
